<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#071025" stroke-width="0.6"/>
    </pattern>
    <style>
      .title { font: 700 44px 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; fill: #F8FAFC; }
      .subtitle { font: 600 18px 'Inter', system-ui, sans-serif; fill: #94A3B8; }
      .role { font: 600 14px 'Inter', system-ui, sans-serif; fill: #94A3B8; }
      .nodeLabel { font: 600 13px 'Inter', system-ui, sans-serif; fill: #F8FAFC; }
      .nodeSmall { font: 500 12px 'Inter', system-ui, sans-serif; fill: #94A3B8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#bg)" />
  <rect width="1600" height="500" fill="url(#grid)" opacity="0.06" />

  <!-- Left panel (glass) -->
  <g transform="translate(60,60)">
    <rect x="0" y="0" width="640" height="380" rx="18" fill="url(#panelGrad)" stroke="#0b1220" stroke-opacity="0.4" />
    <rect x="0" y="0" width="640" height="380" rx="18" fill="rgba(255,255,255,0.02)" />

    <!-- Name and roles -->
    <text x="36" y="86" class="title">SRIVATHSA M</text>
    <text x="36" y="126" class="subtitle">Software Engineer</text>
    <text x="36" y="154" class="role">Full Stack Development • Backend Engineering • AI Systems</text>

    <!-- Accent line -->
    <rect x="36" y="170" width="120" height="4" rx="2" fill="#2563EB" opacity="0.95" filter="url(#softGlow)" />

    <!-- Small descriptive bullets -->
    <g transform="translate(36,200)">
      <rect width="36" height="36" rx="8" fill="#0b1220" stroke="#1f2937" />
      <text x="48" y="24" class="nodeSmall">Building reliable, scalable systems and ML-enabled products.</text>
    </g>
  </g>

  <!-- Right architecture visualization -->
  <g transform="translate(780,60)">
    <!-- Framed panel -->
    <rect x="0" y="0" width="740" height="380" rx="18" fill="rgba(17,24,39,0.05)" stroke="#0b1220"/>

    <!-- Layers (stacked) -->
    <!-- Frontend layer -->
    <g transform="translate(80,36)">
      <text x="0" y="14" class="nodeSmall" fill="#94A3B8">Frontend</text>
      <g transform="translate(0,18)">
        <circle cx="36" cy="36" r="18" fill="#06B6D4" opacity="0.98" filter="url(#softGlow)"/>
        <text x="70" y="42" class="nodeLabel">React</text>

        <circle cx="36" cy="92" r="18" fill="#06B6D4" opacity="0.9"/>
        <text x="70" y="98" class="nodeLabel">Next.js</text>

        <!-- connector -->
        <path d="M36 54 L36 76" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />
      </g>
    </g>

    <!-- Backend layer -->
    <g transform="translate(260,80)">
      <text x="0" y="14" class="nodeSmall" fill="#94A3B8">Backend</text>
      <g transform="translate(0,18)">
        <rect x="0" y="18" width="44" height="36" rx="8" fill="#2563EB" />
        <text x="64" y="42" class="nodeLabel">Node.js</text>

        <rect x="0" y="74" width="64" height="36" rx="8" fill="#2563EB" opacity="0.95" />
        <text x="74" y="98" class="nodeLabel">Express.js</text>

        <!-- vertical connector from frontend to backend -->
        <path d="M36 110 L36 140" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.4" />
      </g>
    </g>

    <!-- Database layer -->
    <g transform="translate(140,200)">
      <text x="0" y="14" class="nodeSmall" fill="#94A3B8">Database</text>
      <g transform="translate(0,18)">
        <ellipse cx="36" cy="38" rx="22" ry="14" fill="#10B981" />
        <text x="70" y="42" class="nodeLabel">MySQL</text>

        <ellipse cx="36" cy="86" rx="22" ry="14" fill="#10B981" opacity="0.95" />
        <text x="70" y="90" class="nodeLabel">PostgreSQL</text>

        <ellipse cx="36" cy="134" rx="22" ry="14" fill="#10B981" opacity="0.9" />
        <text x="70" y="138" class="nodeLabel">MongoDB</text>

        <!-- connector to AI layer -->
        <path d="M36 152 L36 190" stroke="#94A3B8" stroke-width="1.2" opacity="0.35" />
      </g>
    </g>

    <!-- AI layer -->
    <g transform="translate(380,240)">
      <text x="0" y="14" class="nodeSmall" fill="#94A3B8">AI Systems</text>
      <g transform="translate(0,18)">
        <rect x="0" y="18" width="120" height="40" rx="10" fill="#0f172a" stroke="#06B6D4" stroke-width="1" filter="url(#softGlow)"/>
        <text x="12" y="44" class="nodeLabel">AI Systems</text>

        <rect x="0" y="74" width="120" height="36" rx="10" fill="#0f172a" stroke="#2563EB" stroke-width="1" opacity="0.95"/>
        <text x="12" y="98" class="nodeLabel">ML Services</text>

        <rect x="0" y="120" width="120" height="36" rx="10" fill="#0f172a" stroke="#06B6D4" stroke-width="1" opacity="0.9"/>
        <text x="12" y="144" class="nodeLabel">Data Flow</text>
      </g>
    </g>

    <!-- subtle connecting lines across the architecture for flow -->
    <g stroke="#94A3B8" stroke-width="1" stroke-linecap="round" opacity="0.45">
      <path d="M180 120 L240 120" />
      <path d="M240 120 L300 190" stroke-dasharray="6 4"/>
      <path d="M300 190 L420 240" stroke-dasharray="4 3"/>
    </g>

  </g>

  <!-- subtle vignette -->
  <rect width="1600" height="500" fill="url(#bg)" opacity="0.02" />
</svg>
